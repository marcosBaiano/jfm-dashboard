<script>
// Atalhos rápidos
document.querySelectorAll('.filtro-rapido').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        const filtro = this.dataset.filtro;
        const hoje = new Date().toISOString().split('T')[0];
        
        const filtros = {
            'hoje': { inicio: hoje, fim: hoje },
            'ontem': { 
                inicio: new Date(Date.now() - 86400000).toISOString().split('T')[0],
                fim: new Date(Date.now() - 86400000).toISOString().split('T')[0]
            },
            'ultimos_7': {
                inicio: new Date(Date.now() - 7*86400000).toISOString().split('T')[0],
                fim: hoje
            },
            'ultimos_30': {
                inicio: new Date(Date.now() - 30*86400000).toISOString().split('T')[0],
                fim: hoje
            },
            'ultimos_90': {
                inicio: new Date(Date.now() - 90*86400000).toISOString().split('T')[0],
                fim: hoje
            }
        };
        
        if (filtros[filtro]) {
            document.querySelector('[name="data_inicio"]').value = filtros[filtro].inicio;
            document.querySelector('[name="data_fim"]').value = filtros[filtro].fim;
        }
    });
});

// Toggle filtros avançados
document.getElementById('linkFiltrosAvancados').addEventListener('click', function(e) {
    e.preventDefault();
    const filtrosAvancados = document.getElementById('filtrosAvancados');
    filtrosAvancados.style.display = filtrosAvancados.style.display === 'none' ? 'block' : 'none';
    
    const icon = this.querySelector('i');
    if (filtrosAvancados.style.display === 'none') {
        icon.classList.remove('fa-chevron-up');
        icon.classList.add('fa-chevron-down');
        this.textContent = ' Mostrar Filtros Avançados';
    } else {
        icon.classList.remove('fa-chevron-down');
        icon.classList.add('fa-chevron-up');
        this.textContent = ' Ocultar Filtros Avançados';
    }
});

// Toggle recolher/expandir
document.getElementById('btnToggleFiltros').addEventListener('click', function() {
    const form = document.getElementById('formFiltros');
    const icon = this.querySelector('i');
    
    if (form.style.display === 'none') {
        form.style.display = 'block';
        icon.classList.remove('fa-chevron-down');
        icon.classList.add('fa-chevron-up');
        this.textContent = '';
        this.innerHTML = '<i class="fas fa-chevron-up"></i> Recolher';
    } else {
        form.style.display = 'none';
        icon.classList.remove('fa-chevron-up');
        icon.classList.add('fa-chevron-down');
        this.textContent = '';
        this.innerHTML = '<i class="fas fa-chevron-down"></i> Expandir';
    }
});
</script>
